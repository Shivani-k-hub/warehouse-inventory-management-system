<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Warehouse System - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, 
                         Verdana, sans-serif;
            background: linear-gradient(
                135deg, #1a1a2e 0%, #16213e 50%, 
                #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            display: flex;
            width: 900px;
            height: 550px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .login-left {
            flex: 1;
            background: linear-gradient(
                135deg, #667eea, #764ba2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: white;
        }

        .login-left .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .login-left h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-left p {
            font-size: 14px;
            opacity: 0.85;
            text-align: center;
            line-height: 1.8;
        }

        .features {
            margin-top: 30px;
            width: 100%;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            opacity: 0.9;
        }

        .feature-item span:first-child {
            font-size: 18px;
        }

        .login-right {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
        }

        .login-right h2 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-right p {
            color: #666;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
            color: #333;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(
                135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px 
                rgba(102,126,234,0.4);
        }

        .error-msg {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #e53e3e;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Side -->
        <div class="login-left">
            <div class="logo">🏭</div>
            <h1>Warehouse Management System</h1>
            <p>Streamline your warehouse operations with our comprehensive management platform</p>
            <div class="features">
                <div class="feature-item">
                    <span>📦</span>
                    <span>Real-time Inventory Tracking</span>
                </div>
                <div class="feature-item">
                    <span>👥</span>
                    <span>Role-Based Access Control</span>
                </div>
                <div class="feature-item">
                    <span>🔐</span>
                    <span>JWT Secured Authentication</span>
                </div>
                <div class="feature-item">
                    <span>📊</span>
                    <span>Analytics Dashboard</span>
                </div>
            </div>
        </div>

        <!-- Right Side -->
        <div class="login-right">
            <h2>Welcome Back!</h2>
            <p>Sign in to your account to continue</p>

            <div class="error-msg"
                 th:if="${error}">
                ⚠️ <span th:text="${error}"></span>
            </div>

            <form method="post" action="/login">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text"
                           name="username"
                           placeholder="Enter your username"
                           required/>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password"
                           name="password"
                           placeholder="Enter your password"
                           required/>
                </div>
                <button type="submit"
                        class="btn-login">
                    Sign In →
                </button>
            </form>
        </div>
    </div>
</body>
</html>
